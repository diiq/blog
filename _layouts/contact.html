<!DOCTYPE html>
<html lang="en" class="contact">
<head>
	<meta content="IE=edge" http-equiv="X-UA-Compatible">
	<meta content="width=device-width,initial-scale=1" name="viewport">
	<meta charset="UTF-8">
    <link href="{{ "/assets/images/favicon.png"  | absolute_url }}" rel="icon" type="image/png">
    <link
    href="//cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"
    rel="stylesheet"
  />
  	<link rel="stylesheet" href="{{ '/assets/css/style.css?v=' | append: site.github.build_revision | relative_url }}">
	<script src="{{ '/assets/js/hypher.js?v=' | append: site.github.build_revision | relative_url }}"></script>
    <script src="{{ '/assets/js/nav.js?v=' | append: site.github.build_revision | relative_url }}"></script>
    <script src="{{ '/assets/js/trees.js?v=' | append: site.github.build_revision | relative_url }}"></script>
  <title>{{ page.title }} | Sam Bleckley</title>
</head>
<body class="contact-page page">
    <button class="mobile-nav" aria-haspopup="true" onclick="openNav();" aria-label="Menu">
        <div>Sam Bleckley</div>
        <i class="fa fa-lg fa-bars"></i>
    </button>
    <nav id="nav">
        <button class="mobile-nav" aria-haspopup="true" onclick="closeNav();" aria-label="Close menu">
            <div>Sam Bleckley</div>
            <i class="fa fa-lg fa-bars"></i>
        </button>
        <a class="gray" href="/">Sam Bleckley</a>
        <a class="tools" href="/tools">Software</a>
        <a class="services" href="/services">Services</a>
        <a class="writing" href="/blog">Writing</a>
        <a class="art" href="/art">Art</a>
        <a class="contact" href="/contact">Contact</a>
    </nav>
    <main>
        <div class="content">
            <div class="aside">
                <p class="skip-justification">You can always reach me at <a href="mailto:sam@sambleckley.com">sam@sambleckley.com</a>, or by using this form.</p>
            </div>
            <h1>Contact</h1>
            <div class="aside-mobile">
                <p>You can always reach me at <a href="mailto:sam@sambleckley.com">sam@sambleckley.com</a>, or by using this form.</p>
            </div>
            <form action="https://formspree.io/sam@sambleckley.com" method="POST">
                <label>Your contact info:
                    <input type="text" name="contact" placeholder="you@example.com">
                </label>
                </label>
                <label>Message:
                    <textarea name="body"></textarea>
                </label>
                <input type="hidden" name="_next" value="http://www.sambleckley.com/thanks.html">
                <button class="button">Send</button>
            </form>

            <div class="social">
                <a
                  href="https://bsky.app/profile/sambleckley.com"
                  aria-label="Bluesky"
                  title="Bluesky"
                  ><i class="fa-brands fa-lg fa-bluesky"></i
                ></a>
                <a
                  <a
                  class="email"
                  href="mailto:sam@sambleckley.com"
                  aria-label="Email"
                  title="Email"
                  ><i class="fa fa-lg fa-envelope"></i
                ></a>
                <a
                href="https://www.linkedin.com/in/sam-bleckley/"
                aria-label="LinkedIn"
                title="LinkedIn"
                ><i class="fa fa-brands fa-lg fa-linkedin"></i
              ></a>
              <a href="https://github.com/diiq" aria-label="Github" title="Github"
                ><i class="fa fa-brands fa-lg fa-github"></i
              ></a>
                <a
                  class="rss"
                  href="https://sambleckley.com/feed.xml"
                  aria-label="RSS Feed"
                  title="RSS Feed"
                  ><i class="fa fa-lg fa-rss"></i
                ></a>
              </div>
        </div>
    </main>
    <footer>
      <a href="mailto:sam@sambleckley.com">sam@sambleckley.com</a>
    </footer>
</body>
</html>
